name: Flash & snap ESP-BSP via ESPBrew

# Manual-only hardware workflow. Validates that ESP-BSP examples can be flashed
# (and, optionally, snapshotted) with our new ESPBrew approach, replacing the old
# "bspwall" method (pytest-embedded + /dev/boards/* on a privileged self-hosted runner).
#
#   build -> ubuntu + espressif/idf: build ONLY the esp-bsp BSPs that ESPBrew
#            supports (see .github/workflows/boards.yaml), one build_<bsp> dir
#            per BSP. Each BSP is mapped to its ESPBrew alias (the names differ:
#            esp-bsp `esp-box-3` -> espbrew `esp32-s3-box-3`). The output is
#            repackaged into flash-files-<alias>/ artifacts.
#
#   flash -> [espbrew] runner (a client to the ESPBrew cluster leader). Download
#            the build artifact, keep only the boards in the `boards` input, then
#            run `espbrew flash-batch --artifacts-dir …` which flashes every board
#            in parallel (reading real offsets from build/flash_args) and monitors
#            each for `monitor_duration` seconds, failing fast on an abort(). This
#            is the core "can espbrew flash + boot-check the wall?" gate.
#
#   snap  -> [espbrew] runner (opt-in, gated on enable_snap). Per board in
#            `snap_boards`, run `espbrew snap … --skip-flash …` to monitor-boot
#            + capture a camera frame. Optional: a board without a camera aimed
#            at it must never fail CI.
#
# Board identity moved from ESP-BSP's host-level /dev/boards/<board> mount to the
# ESPBrew cluster's alias -> /dev/serial/by-id map. The only thing the repo must
# keep in sync with the live cluster is boards.yaml (esp-bsp BSP -> espbrew alias).
#
# Security: this workflow only triggers on manual dispatch, so pull requests
# (including from forks) can never execute steps on the self-hosted hardware runner.
# The snap job also carries a guard step as defense in depth. See the note at the
# bottom of this file about the matching GitHub repository settings.

on:
  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF release to build with'
        type: string
        default: 'release-v6.1'
      boards:
        description: >-
          Comma-separated ESPBrew aliases to flash (empty = all built boards).
          Must match aliases registered in the live cluster's espbrew.toml.
        type: string
        default: ''
      enable_snap:
        description: 'Also run the optional camera-capture (snap) job'
        type: boolean
        default: false
      snap_boards:
        description: 'Comma-separated aliases that have a camera aimed at them (e.g. esp32-s3-box-3)'
        type: string
        default: 'esp32-s3-box-3'
      snap_duration:
        description: 'Snap capture duration (seconds)'
        type: string
        default: '10'
      monitor_duration:
        description: 'Post-flash monitor duration (seconds)'
        type: string
        default: '10'

# Self-hosted runners still need read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build ONLY the esp-bsp BSPs that ESPBrew supports (see boards.yaml), and
  # repackage each build_<bsp> dir into a flash-files-<alias>/ artifact where
  # <alias> is the ESPBrew alias from boards.yaml.
  #
  # We build each BSP explicitly with `idf.py build -DSDKCONFIG_DEFAULTS=…` so
  # the set-bsp action (examples/bsp_ext.py, enabled via IDF_EXTRA_ACTIONS_PATH)
  # picks exactly that BSP. This avoids building the dozens of unsupported BSPs
  # (and the examples that fail to build for them).
  # ---------------------------------------------------------------------------
  build:
    name: Build ESPBrew-supported boards
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${{ inputs.idf_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build supported boards
        env:
          GITHUB_WORKSPACE: "${{ github.workspace }}"
        shell: bash
        run: |
          set -euo pipefail
          export IDF_PYTHON_CHECK_CONSTRAINTS=yes
          # Makes examples/bsp_ext.py (the set-bsp action) available to idf.py,
          # exactly like build-run-applications.yml.
          export IDF_EXTRA_ACTIONS_PATH="${GITHUB_WORKSPACE}/examples"
          # Avoid git's "detected dubious ownership" when the checkout is owned by a
          # different uid than the runner (the earlier run tripped on this).
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ${IDF_PATH}/install.sh --enable-ci
          source ${IDF_PATH}/export.sh

          rm -rf tmp-flash
          mkdir -p tmp-flash

          # Parse boards.yaml into: bsp<TAB>alias1,alias2<TAB>example<TAB>snap
          python3 - <<'PY' > /tmp/boards.txt
          import yaml
          d = yaml.safe_load(open('.github/workflows/boards.yaml'))
          for b in d['boards']:
              aliases = ','.join(a.strip() for a in b['espbrew_alias'].split(','))
              snap = 'true' if b.get('snap') else 'false'
              print('\t'.join([b['bsp'], aliases, b.get('example', 'display'), snap]))
          PY

          built=0
          while IFS=$'\t' read -r bsp aliases example snap; do
            [ -z "$bsp" ] && continue
            echo ">>> building $example / bsp $bsp -> aliases: $aliases"
            if [ ! -d "examples/$example" ]; then
              echo "::warning::example $example not found; skipping"
              continue
            fi
            # Reset the `set-bsp` manifest + component-resolution state at the
            # repo root (correct relative paths). `set-bsp` rewrites
            # main/idf_component.yml (tracked) before each build, so restore it.
            # `dependencies.lock` is gitignored (not tracked) so it can't be
            # reset with `git checkout`; `rm -f` forces fresh resolution and
            # avoids the `esp_lcd_ili9341` "both project_managed_components"
            # conflict that `m5stack_core_2` hit. `rm -rf .deps` clears the
            # project-level component-manager cache too, so a stale BSP's
            # components can't leak into the next build.
            git checkout -- "examples/$example/main/idf_component.yml" 2>/dev/null || true
            rm -f "examples/$example/dependencies.lock"
            rm -rf "examples/$example/.deps"
            cd "examples/$example"
            # Plain `idf.py build` (like the raylib espbrew workflow). It writes
            # to the example's default `build/` dir. We copy that dir into place
            # immediately after each BSP, so sharing one build/ across BSPs is
            # fine. `</dev/null` keeps idf.py from ever consuming the loop's
            # stdin (the boards list).
            if ! idf.py build -DSDKCONFIG_DEFAULTS=sdkconfig.bsp.$bsp </dev/null; then
              echo "::warning::build failed for bsp $bsp (skipping; continuing)"
              cd "$GITHUB_WORKSPACE"
              continue
            fi
            cd "$GITHUB_WORKSPACE"
            # Copy the build output to each espbrew alias dir. flash-batch maps
            # each `flash-files-<alias>` dir to the board alias by stripping the
            # `flash-files-` prefix, so the dir name IS the espbrew alias.
            for alias in ${aliases//,/ }; do
              mkdir -p "tmp-flash/flash-files-$alias"
              cp -a "examples/$example/build/." "tmp-flash/flash-files-$alias/"
              echo "  $bsp -> flash-files-$alias/"
            done
            built=$((built + 1))
          done < /tmp/boards.txt

          if [ "$built" -eq 0 ]; then
            echo "::error::no boards built; nothing to flash"
            exit 1
          fi
          echo "Built $built board image(s) into tmp-flash/flash-files-*"

      - name: Upload flash artifacts
        uses: actions/upload-artifact@v7
        with:
          name: espbsp-flash
          path: tmp-flash/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flash + boot-check every requested board on the ESPBrew runner.
  #
  # The runner is only a client to the cluster leader, so espbrew reads the flash
  # plan from each board's build/flash_args and selects the device by alias. No
  # privileged container, no /dev/boards mount — just the alias.
  # ---------------------------------------------------------------------------
  flash:
    name: Flash & monitor (ESPBrew)
    needs: build
    runs-on: [self-hosted, Linux, espbrew]
    env:
      MONITOR_DURATION: "${{ inputs.monitor_duration }}"
      BOARDS_INPUT: "${{ inputs.boards }}"
      ERROR_STRING: "abort() was called at PC"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download espbrew (arch-aware)
        # The self-hosted runner may be x64 or arm; pick the matching release so we
        # never land an amd64 binary on an arm64 host (opaque "exec format error").
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/v0.10.0/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: espbsp-flash
          path: tmp-flash/

      - name: Keep only the requested boards
        # flash-batch --artifacts-dir derives one board per flash-files-<alias> dir.
        # If `boards` is set, copy only those aliases into a filtered dir so unknown
        # (unregistered) boards can't fail the batch. Empty input = keep everything.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keep
          if [ -z "${BOARDS_INPUT}" ]; then
            echo "boards input empty — flashing all built boards:"
            ls -1 tmp-flash/
            # Empty input = keep everything; copy all flash-files-* dirs into keep/.
            cp -a tmp-flash/. keep/
          else
            IFS=',' read -r -a want <<< "${BOARDS_INPUT}"
            for a in "${want[@]}"; do
              a="${a//[[:space:]]/}"
              [ -z "$a" ] && continue
              if [ -d "tmp-flash/flash-files-$a" ]; then
                cp -a "tmp-flash/flash-files-$a/" "keep/"
                echo "keeping board: $a"
              else
                echo "::warning::board '$a' has no built artifact; skipping"
              fi
            done
          fi
          echo "flash-batch will run against: $(ls -1 keep | tr '\n' ' ')"

      - name: Flash + monitor all boards
        # flash-batch flashes every board in parallel (the leader's worker pool
        # handles concurrency), reads real offsets from build/flash_args, monitors
        # each board for MONITOR_DURATION seconds, and fails a board the instant its
        # boot prints ERROR_STRING. Exits non-zero if any board fails.
        shell: bash
        run: |
          set -euo pipefail
          ./espbrew --cluster "${ESPBREW_CLUSTER}" flash-batch \
            --artifacts-dir keep \
            --artifacts-layout "flash-files-<example>" \
            --monitor-duration "${MONITOR_DURATION}" \
            --exit-on-error "${ERROR_STRING}"

  # ---------------------------------------------------------------------------
  # Optional camera capture. Runs AFTER flash (each board is already flashed and
  # running on the leader), so we use --skip-flash and let espbrew only monitor-boot
  # + capture a frame. Optional: a board without a camera aimed at it must not fail
  # CI, so the whole job is continue-on-error and each board is independent.
  # ---------------------------------------------------------------------------
  snap:
    name: Snap (ESPBrew camera)
    needs: flash
    if: github.event.inputs.enable_snap == 'true'
    runs-on: [self-hosted, Linux, espbrew]
    continue-on-error: true
    env:
      SNAP_DURATION: "${{ inputs.snap_duration }}"
      SNAP_BOARDS: "${{ inputs.snap_boards }}"
    steps:
      # --- Security: never run on untrusted PR / fork code -------------------
      - name: Refuse to run on PRs / forks
        if: github.event.pull_request != null || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::This hardware workflow only runs on manual dispatch."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download espbrew (arch-aware)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  ESPBREW_ARCH="linux-amd64" ;;
            aarch64) ESPBREW_ARCH="linux-arm64" ;;
            *)       ESPBREW_ARCH="linux-amd64" ;;
          esac
          echo "Downloading espbrew-${ESPBREW_ARCH}"
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/v0.10.0/espbrew-${ESPBREW_ARCH}" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: espbsp-flash
          path: tmp-flash/

      - name: Snap each board (monitor + camera capture)
        # One shell invocation, looped per board in snap_boards. --skip-flash keeps
        # the already-flashed firmware running; espbrew monitors for SNAP_DURATION and
        # writes a per-board zip to snapshots/<alias>.zip for the upload below.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p snapshots
          IFS=',' read -r -a boards <<< "${SNAP_BOARDS}"
          for alias in "${boards[@]}"; do
            alias="${alias//[[:space:]]/}"
            [ -z "$alias" ] && continue
            if [ ! -d "tmp-flash/flash-files-$alias" ]; then
              echo "::warning::no build for snap board '$alias'; skipping"
              continue
            fi
            echo ">>> snap $alias"
            ( cd "tmp-flash/flash-files-$alias" \
              && ./../../espbrew --cluster "${ESPBREW_CLUSTER}" snap \
                   --filter-alias "$alias" \
                   --skip-flash \
                   --duration "${SNAP_DURATION}" \
                   --save-dir snap-out \
                   --zip "../snapshots/$alias.zip" ) || \
              echo "::warning::snap failed for '$alias' (camera? board running?)"
          done
          echo "snap zips: $(ls -1 snapshots/*.zip 2>/dev/null | tr '\n' ' ' || true)"

      - name: Upload snapshot zips
        if: hashFiles('snapshots/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-zips
          path: snapshots/
          retention-days: 30

# ---------------------------------------------------------------------------
# Repo setting to disable for full safety (matching the conways/spooky reference):
#   Settings -> Actions -> "Allow GitHub Actions workflows and API requests from
#   fork pull requests" should be UNCHECKED, so fork contributors cannot run
#   arbitrary workflows on this repo's self-hosted hardware runner.
# This workflow itself is workflow_dispatch-only and carries the snap guard above.
# ---------------------------------------------------------------------------

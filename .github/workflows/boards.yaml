# boards.yaml — esp-bsp -> ESPBrew alias mapping for the flash job.
#
# This is the single source of truth for the self-hosted `flash` job. It maps
# each ESP-BSP *BSP directory* (the `build_<bsp>` dir that `idf.py build`
# emits) to the ESPBrew *alias(es)* registered in the live cluster's espbrew.toml.
#
# WHY THIS FILE EXISTS (important):
#   ESP-BSP's BSP directory names do NOT match ESPBrew's alias spelling. The
#   workflow cannot just normalise `_` -> `-`; it needs an explicit map, e.g.
#     esp-bsp `esp-box-3`          -> espbrew `esp32-s3-box-3`
#     esp-bsp `m5_atom_s3`          -> espbrew `m5stack-atom-s3` (+ -r)
#     esp-bsp `m5stack_core_2`      -> espbrew `m5stack-core2`
#     esp-bsp `esp32_s3_lcd_ev_board` -> espbrew `esp32-s3-lcd-ev-board`  (matches)
#
# BOARD SELECTION:
#   Only the boards that are BOTH (a) registered in espbrew AND (b) enabled in
#   the other three espbrew repos (conways / spooky / raylib) are listed here.
#   That common set is 5 boards across 4 BSPs (atom-s3 and atom-s3r share the
#   `m5_atom_s3` BSP). The 6th board conways uses (waveshare
#   esp32-s3-touch-lcd-1.28) is intentionally NOT included because spooky and
#   raylib do not flash it — add it back only if you want it everywhere.
#
# Each entry:
#   bsp:          esp-bsp BSP directory name (build_<bsp> is produced by the build)
#   espbrew_alias: comma-separated espbrew alias(es) for this BSP
#   example:      esp-bsp example dir that ships this BSP (examples/<example>)
#   snap:         optional; set true if a camera is aimed at this board

boards:
  # --- esp32-s3-box-3 --------------------------------------------------------
  - bsp: esp-box-3
    espbrew_alias: esp32-s3-box-3
    example: display
    snap: true          # has a camera aimed at its screen

  # --- esp32-s3-lcd-ev-board -------------------------------------------------
  - bsp: esp32_s3_lcd_ev_board
    espbrew_alias: esp32-s3-lcd-ev-board
    example: display

  # --- m5stack-atom-s3 AND m5stack-atom-s3r ----------------------------------
  # Both are separate espbrew aliases (distinct USB-JTAG serial ids) but share
  # the single esp-bsp `m5_atom_s3` BSP. The build emits one `build_m5_atom_s3`
  # which is copied to BOTH alias dirs, so both boards flash the same demo.
  - bsp: m5_atom_s3
    espbrew_alias: "m5stack-atom-s3,m5stack-atom-s3r"
    example: display

  # --- m5stack-core2 ---------------------------------------------------------
  - bsp: m5stack_core_2
    espbrew_alias: m5stack-core2
    example: display
